name: Mandolino
options:
  bundleIdPrefix: com.gasserp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    DEVELOPMENT_TEAM: 6V9CGD373N
    CODE_SIGN_STYLE: Automatic
targets:
  Mandolino:
    type: application
    platform: iOS
    sources: [Mandolino]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gasserp.mandolino
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mandolino
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  MandolinoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MandolinoTests]
    dependencies:
      - target: Mandolino
  MandolinoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MandolinoUITests]
    dependencies:
      - target: Mandolino
schemes:
  Mandolino:
    build:
      targets:
        Mandolino: all
    test:
      targets: [MandolinoTests, MandolinoUITests]
